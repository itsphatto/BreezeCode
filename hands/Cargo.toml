[package]
name = "breeze-hands"
version = "0.1.0"
edition = "2021"
description = "Breeze Agent's hands: mouse and keyboard for Device Control, as a sidecar outside Electron"

[dependencies]
enigo = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
