[package]
name = "breeze-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
ropey = { version = "1.6", default-features = false, features = ["simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
memchr = "2"

[profile.release]
opt-level = 3
lto = true
